<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>机器人图片库</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #101410;
      --panel: #191f19;
      --panel-hi: #222a22;
      --line: #343d33;
      --paper: #f1f1df;
      --muted: #a6afa2;
      --acid: #d3f56a;
      --acid-ink: #202814;
      --orange: #f4a779;
      --danger: #ff9285;
      --mono: "Cascadia Code", Consolas, monospace;
      --sans: "Microsoft YaHei UI", "Segoe UI", sans-serif;
      --serif: Georgia, "Noto Serif SC", "Songti SC", serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      color: var(--paper);
      background:
        radial-gradient(ellipse at 78% 0%, rgba(211,245,106,.09), transparent 32rem),
        linear-gradient(135deg, rgba(255,255,255,.018) 25%, transparent 25%) 0 0 / 7px 7px,
        var(--ink);
      font-family: var(--sans);
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; }
    .topbar { height: 62px; display:flex; align-items:center; justify-content:space-between; padding:0 clamp(18px,4vw,64px); border-bottom:1px solid var(--line); }
    .brand { display:flex; gap:11px; align-items:center; color:var(--paper); text-decoration:none; letter-spacing:.08em; font-size:12px; font-weight:700; }
    .brand-mark { display:grid; width:26px; height:26px; place-items:center; color:var(--acid-ink); background:var(--acid); border-radius:8px 8px 8px 2px; font:700 15px var(--serif); }
    .top-note { color:var(--muted); font:11px var(--mono); letter-spacing:.12em; text-transform:uppercase; }
    main { width:min(1440px, 100%); margin:auto; padding:34px clamp(18px,4vw,64px) 60px; }
    .hero { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:24px; align-items:end; margin:12px 0 30px; }
    .eyebrow { margin:0 0 12px; color:var(--acid); font:11px var(--mono); letter-spacing:.18em; text-transform:uppercase; }
    h1 { margin:0; font:normal clamp(34px,5vw,66px)/1 var(--serif); letter-spacing:-.045em; }
    .intro { max-width:560px; margin:14px 0 0; color:var(--muted); font-size:14px; line-height:1.75; }
    .stats { display:flex; gap:10px; }
    .hero-side { display:grid; gap:10px; min-width:min(100%,420px); }
    .auto-switch { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:12px 15px; border:1px solid var(--line); background:var(--panel); }
    .auto-switch strong { display:block; color:var(--paper); font-size:12px; }
    .auto-switch small { display:block; margin-top:4px; color:var(--muted); font-size:10px; }
    .auto-switch input { appearance:none; position:relative; width:42px; height:24px; flex:none; border:1px solid #788477; border-radius:20px; background:#333b32; cursor:pointer; transition:background .18s,border-color .18s; }
    .auto-switch input:before { content:""; position:absolute; top:3px; left:3px; width:16px; height:16px; border-radius:50%; background:#c0c8bd; transition:transform .18s,background .18s; }
    .auto-switch input:checked { border-color:var(--acid); background:#809e38; }
    .auto-switch input:checked:before { transform:translateX(18px); background:#fff; }
    .auto-switch input:focus-visible { outline:2px solid var(--acid); outline-offset:3px; }
    .auto-switch input:disabled { opacity:.55; cursor:wait; }
    .stat { min-width:108px; padding:13px 15px; border:1px solid var(--line); background:rgba(25,31,25,.8); }
    .stat strong { display:block; color:var(--acid); font:22px var(--mono); }
    .stat span { color:var(--muted); font-size:11px; }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; gap:10px; padding:12px; margin:0 0 18px; border:1px solid var(--line); background:var(--panel); }
    .search-wrap { position:relative; flex:1 1 260px; }
    .search-icon { position:absolute; left:13px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:16px; pointer-events:none; }
    .search, .select { height:42px; color:var(--paper); border:1px solid var(--line); border-radius:0; outline:none; background:#111711; }
    .search { width:100%; padding:0 14px 0 39px; }
    .select { min-width:148px; padding:0 12px; }
    .search:focus, .select:focus, .tag-input:focus { border-color:var(--acid); box-shadow:0 0 0 2px rgba(211,245,106,.12); }
    .toolbar-meta { color:var(--muted); font:11px var(--mono); white-space:nowrap; margin-left:auto; }
    .select-page { display:flex; align-items:center; gap:8px; padding:0 5px; color:var(--muted); font-size:11px; white-space:nowrap; }
    .select-page input,.card-select { accent-color:#809e38; width:17px; height:17px; cursor:pointer; }
    .select-page.is-disabled,.select-page.is-disabled input { color:#6d776a; cursor:not-allowed; }
    .bulk-bar .bulk-delete { color:#ffc0b7; border-color:#75443e; }
    .bulk-bar .bulk-delete:hover { background:#482a27; }
    .bulk-bar button:disabled { opacity:.35; cursor:not-allowed; }
    .trash-bar { display:flex; flex-wrap:wrap; align-items:center; gap:9px; margin:-6px 0 18px; padding:10px 13px; color:var(--muted); border:1px dashed var(--line); font-size:11px; }
    .trash-bar .trash-note { margin-right:auto; }
    .trash-bar button { min-height:32px; padding:0 11px; color:var(--paper); border:1px solid var(--line); background:transparent; font-size:11px; }
    .trash-bar button:hover { color:var(--danger); border-color:#75443e; background:#482a27; }
    .trash-bar button:disabled { opacity:.35; cursor:not-allowed; }
    .bulk-bar { display:flex; flex-wrap:wrap; align-items:center; gap:9px; margin:-5px 0 18px; padding:11px 13px; border:1px solid #68764f; background:#20281c; }
    .bulk-bar[hidden] { display:none; }
    .bulk-count { margin-right:auto; color:var(--paper); font-size:12px; }
    .bulk-bar button { min-height:36px; padding:0 13px; color:var(--paper); border:1px solid var(--line); background:transparent; font-size:11px; }
    .bulk-bar button:hover { border-color:var(--acid); }
    .bulk-bar .bulk-reject { color:#ffc0b7; border-color:#75443e; }
    .bulk-bar .bulk-reject:hover { background:#482a27; }
    .gallery { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px; }
    .card { min-width:0; overflow:hidden; border:1px solid var(--line); background:var(--panel); transition:border-color .18s, transform .18s; }
    .card:hover { border-color:#79866b; transform:translateY(-2px); }
    .thumb { position:relative; display:grid; width:100%; aspect-ratio:1.18; place-items:center; overflow:hidden; background:#0b100c; border:0; padding:0; }
    .thumb img { width:100%; height:100%; object-fit:contain; transition:transform .28s; }
    .card:hover .thumb img { transform:scale(1.025); }
    .thumb:after { content:"OPEN IMAGE ↗"; position:absolute; right:10px; bottom:9px; padding:5px 7px; color:#fff; background:rgba(8,12,8,.76); font:9px var(--mono); letter-spacing:.08em; opacity:0; transition:opacity .15s; }
    .card:hover .thumb:after, .thumb:focus-visible:after { opacity:1; }
    .card-body { padding:12px 13px 13px; }
    .card-line { display:flex; align-items:center; justify-content:space-between; gap:10px; color:var(--muted); font:10px var(--mono); }
    .card-date { color:var(--acid); }
    .file-id { overflow:hidden; margin:8px 0 10px; color:var(--paper); font:12px var(--mono); text-overflow:ellipsis; white-space:nowrap; }
    .tag-row { display:flex; min-height:25px; flex-wrap:wrap; gap:5px; }
    .tag { max-width:100%; padding:4px 7px; overflow:hidden; color:#d4dfcb; border:1px solid #424b3d; background:#232b21; font-size:10px; text-overflow:ellipsis; white-space:nowrap; }
    .theme-tag { color:#b9e8ff; border-color:#3a6578; background:#183240; }
    .tag-ai { color:#c7ddf5; border-color:#3c566c; background:#1b2935; }
    .tag-value { color:#e2f59a; border-color:#60733b; background:#29351d; }
    .tag-warn { color:#ffd0ad; border-color:#76543a; background:#38291d; }
    .analysis-caption { display:-webkit-box; margin:8px 0 0; overflow:hidden; color:#aeb8a8; font-size:10px; line-height:1.55; -webkit-box-orient:vertical; -webkit-line-clamp:2; }
    .no-tags { color:#828d7e; font-size:10px; }
    .card-actions { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:12px; padding-top:10px; border-top:1px solid #2b332b; }
    .size { color:var(--muted); font:10px var(--mono); }
    .edit-button, .primary, .quiet, .danger-button, .pager button { border:1px solid var(--line); border-radius:0; color:var(--paper); background:transparent; transition:background .15s,color .15s,border-color .15s; }
    .edit-button { padding:6px 9px; font-size:11px; }
    .edit-button:hover, .quiet:hover, .pager button:hover { border-color:#859176; background:#2a3428; }
    .primary { padding:10px 15px; color:var(--acid-ink); border-color:var(--acid); background:var(--acid); font-weight:700; }
    .primary:hover { background:#e1ff87; }
    .danger-button { padding:10px 14px; color:var(--danger); border-color:#75443e; }
    .danger-button:hover { background:#482a27; }
    .empty, .loading { grid-column:1/-1; padding:70px 20px; color:var(--muted); border:1px dashed var(--line); text-align:center; }
    .empty-mark { color:var(--acid); font:48px var(--serif); }
    .pager { display:flex; align-items:center; justify-content:center; gap:14px; margin-top:24px; }
    .pager button { min-width:88px; padding:9px 12px; }
    .pager button:disabled { opacity:.35; cursor:not-allowed; }
    .page-count { color:var(--muted); font:11px var(--mono); }
    dialog { color:var(--paper); }
    .editor { position:fixed; inset:0 0 0 auto; width:min(510px,100vw); max-width:none; max-height:100vh; height:100vh; margin:0; padding:0; border:0; border-left:1px solid var(--line); background:#151b15; box-shadow:-24px 0 80px rgba(0,0,0,.45); }
    .editor::backdrop { background:rgba(0,0,0,.62); backdrop-filter:blur(3px); }
    .editor-inner { display:flex; height:100%; flex-direction:column; }
    .editor-head { display:flex; align-items:flex-start; justify-content:space-between; padding:22px 24px 16px; border-bottom:1px solid var(--line); }
    .editor-head h2 { margin:0; font:normal 25px var(--serif); }
    .editor-head p { margin:6px 0 0; color:var(--muted); font:10px var(--mono); }
    .close { width:34px; height:34px; color:var(--paper); border:1px solid var(--line); background:transparent; font-size:18px; }
    .editor-scroll { flex:1; overflow:auto; padding:20px 24px; }
    .preview { display:grid; min-height:190px; max-height:360px; place-items:center; margin-bottom:18px; overflow:hidden; background:#080c08; border:1px solid var(--line); }
    .preview img { display:block; max-width:100%; max-height:360px; object-fit:contain; }
    .analysis-note { margin:-4px 0 18px; padding:12px; color:var(--muted); border-left:2px solid var(--acid); background:#1b231a; font-size:11px; line-height:1.7; }
    .meta-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:24px; }
    .meta-cell { padding:10px; border:1px solid var(--line); }
    .meta-cell span { display:block; margin-bottom:6px; color:var(--muted); font-size:10px; }
    .meta-cell strong { font:11px var(--mono); overflow-wrap:anywhere; }
    .field-label { display:block; margin:0 0 9px; font-size:12px; font-weight:700; }
    .tag-help { margin:0 0 11px; color:var(--muted); font-size:11px; line-height:1.6; }
    .tag-editor { display:flex; min-height:49px; flex-wrap:wrap; align-items:center; gap:7px; padding:8px; border:1px solid var(--line); background:#0e130e; }
    .tag-pill { display:flex; align-items:center; gap:7px; padding:5px 7px; color:var(--acid-ink); background:var(--acid); font-size:11px; }
    .tag-pill button { width:16px; height:16px; padding:0; color:var(--acid-ink); border:0; background:transparent; font-size:15px; line-height:1; }
    .tag-input { flex:1 1 135px; min-width:120px; height:30px; padding:0 5px; color:var(--paper); border:1px solid transparent; outline:none; background:transparent; font-size:12px; }
    .semantic-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:22px; }
    .semantic-grid label:first-child { grid-column:1/-1; }
    .semantic-grid span { display:block; margin-bottom:8px; color:var(--muted); font-size:11px; }
    .semantic-grid select,.semantic-grid input { width:100%; height:40px; padding:0 10px; color:var(--paper); border:1px solid var(--line); background:#0e130e; }
    .semantic-grid select:focus,.semantic-grid input:focus { outline:1px solid var(--acid); }
    .editor-foot { display:flex; justify-content:space-between; gap:10px; padding:16px 24px 20px; border-top:1px solid var(--line); background:#151b15; }
    .foot-right { display:flex; gap:8px; }
    .toast { position:fixed; left:50%; bottom:24px; z-index:5; max-width:min(600px,calc(100vw - 32px)); padding:12px 16px; color:var(--ink); background:var(--acid); box-shadow:0 8px 30px rgba(0,0,0,.3); font-size:12px; opacity:0; transform:translate(-50%,12px); pointer-events:none; transition:opacity .2s,transform .2s; }
    .toast.show { opacity:1; transform:translate(-50%,0); }
    .toast.error { color:#fff; background:#9a443c; }
    .skeleton { background:linear-gradient(100deg,#1a211a 20%,#252f24 36%,#1a211a 52%); background-size:220% 100%; animation:shimmer 1.2s linear infinite; }
    @keyframes shimmer { to { background-position-x:-220%; } }
    @media (max-width:1100px) { .gallery { grid-template-columns:repeat(3,minmax(0,1fr)); } }
    @media (max-width:760px) { main { padding-top:24px; } .hero { grid-template-columns:1fr; align-items:start; } .hero-side { min-width:0; } .stats { width:100%; } .stat { flex:1; min-width:0; } .gallery { grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; } .toolbar-meta { width:100%; margin-left:0; } }
    @media (max-width:430px) { .gallery { grid-template-columns:1fr; } .thumb { aspect-ratio:1.25; } .top-note { display:none; } .editor-head,.editor-scroll { padding-left:16px; padding-right:16px; } .editor-foot { padding:12px 16px 16px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto!important; animation-duration:.01ms!important; animation-iteration-count:1!important; transition-duration:.01ms!important; } }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/"><span class="brand-mark">D</span><span>DEEPSEEK · VISUAL ARCHIVE</span></a>
    <div class="top-note"><a href="/settings" style="color:var(--acid);text-decoration:none">运行设置 ↗</a> &nbsp; / &nbsp; <a href="/models" style="color:var(--acid);text-decoration:none">对话模型 ↗</a> &nbsp; / &nbsp; LOCAL LIBRARY</div>
  </header>
  <main>
    <section class="hero">
      <div>
        <p class="eyebrow">BOT MEMORY / IMAGE INDEX</p>
        <h1>机器人图片库</h1>
        <p class="intro">浏览机器人存下的图片，查看 AI 对照片类型、收藏价值和重复项的判断，并整理表情关键词。图片只在本机查看和管理。</p>
      </div>
      <div class="hero-side">
        <label class="auto-switch" for="autoStickerToggle"><span><strong>自动收录表情</strong><small id="autoStickerState">读取开关状态…</small></span><input id="autoStickerToggle" type="checkbox" disabled aria-label="自动收录新表情包"></label>
        <div class="stats" aria-label="图片库统计">
          <div class="stat"><strong id="statImages">—</strong><span>张图片</span></div>
          <div class="stat"><strong id="statTags">—</strong><span>个表情关键词</span></div>
          <div class="stat"><strong id="statSize">—</strong><span>占用空间</span></div>
        </div>
      </div>
    </section>
    <section class="toolbar" aria-label="图片筛选">
      <label class="search-wrap"><span class="search-icon" aria-hidden="true">⌕</span><input class="search" id="search" type="search" placeholder="搜索 AI 标签、画面内容或关键词" autocomplete="off" aria-label="搜索图片"></label>
      <select class="select" id="dayFilter" aria-label="按日期筛选"><option value="">全部日期</option></select>
      <select class="select" id="statusFilter" aria-label="按审核状态筛选"><option value="">全部状态</option><option value="pending">待审核</option><option value="approved">已启用</option><option value="rejected">已停用</option><option value="archive">仅归档</option></select>
      <select class="select" id="analysisFilter" aria-label="按 AI 识别结果筛选"><option value="">全部 AI 结果</option><option value="photo">照片</option><option value="nonphoto">非照片</option><option value="valuable">有收藏价值</option><option value="low-value">收藏价值低</option><option value="duplicate">重复</option><option value="unique">未发现重复</option></select>
      <select class="select" id="sortFilter" aria-label="排序方式"><option value="newest">最近存入</option><option value="largest">文件最大</option></select>
      <label class="select-page"><input id="selectPage" type="checkbox" aria-label="选择本页所有图片">选择本页</label>
      <span class="toolbar-meta" id="resultCount">读取图片索引…</span>
    </section>
    <div class="bulk-bar" id="bulkBar" hidden><span class="bulk-count" id="selectedCount">已选 0 张</span><button id="bulkApprove" type="button" title="只对已绑定表情关键词的图片生效">审核通过</button><button class="bulk-reject" id="bulkReject" type="button" title="只对已绑定表情关键词的图片生效">一键拉黑</button><button class="bulk-delete" id="bulkTrash" type="button" title="移入回收目录可恢复，清空回收后才真正释放磁盘">移入回收（删除）</button><button id="clearSelection" type="button">取消选择</button></div>
    <div class="trash-bar" id="trashBar"><span class="trash-note" id="trashInfo">回收目录：读取中…</span><button id="emptyTrash" type="button" disabled>清空回收</button></div>
    <section class="gallery" id="gallery" aria-live="polite"><div class="loading">正在读取本机图片索引…</div></section>
    <nav class="pager" aria-label="图片分页"><button id="prevPage" type="button">← 上一页</button><span id="pageCount" class="page-count">—</span><button id="nextPage" type="button">下一页 →</button></nav>
  </main>

  <dialog class="editor" id="editor" aria-labelledby="editorTitle">
    <div class="editor-inner">
      <header class="editor-head"><div><h2 id="editorTitle">整理图片</h2><p id="editorId">—</p></div><button class="close" id="closeEditor" type="button" aria-label="关闭">×</button></header>
      <div class="editor-scroll">
        <div class="preview"><img id="previewImage" alt="图片预览"></div>
        <div class="analysis-note" id="analysisNote" aria-live="polite">读取 AI 图片识别结果…</div>
        <div class="meta-grid"><div class="meta-cell"><span>存档日期</span><strong id="metaDay">—</strong></div><div class="meta-cell"><span>文件大小</span><strong id="metaSize">—</strong></div></div>
        <label class="field-label" for="moderationStatus">机器人使用状态</label>
        <select class="select" id="moderationStatus" style="width:100%;margin-bottom:18px"><option value="pending">待审核（不会被机器人使用）</option><option value="approved">已启用</option><option value="rejected">已停用（保留图片）</option></select>
        <label class="field-label" for="tagInput">表情关键词</label>
        <p class="tag-help">添加、删除或改名关键词。删除全部关键词只会取消表情关联，原图仍保留在图库中。</p>
        <div class="tag-editor" id="tagEditor"><input class="tag-input" id="tagInput" placeholder="输入关键词后按 Enter" maxlength="40" autocomplete="off"></div>
        <div class="semantic-grid" aria-label="图片自动识别信息">
          <label><span>DeepSeek 主题识别（可手动纠正）</span><select id="deepseekTheme"><option value="">尚未识别</option><option value="yes">是 DeepSeek 主题</option><option value="no">不是 DeepSeek 主题</option></select></label>
          <label><span>画面动作</span><input id="semanticAction" maxlength="24" placeholder="例如：挥手打招呼"></label>
          <label><span>表达情绪</span><input id="semanticEmotion" maxlength="24" placeholder="例如：开心、期待"></label>
        </div>
      </div>
      <footer class="editor-foot"><button class="danger-button" id="deleteImage" type="button">删除图片</button><div class="foot-right"><button class="quiet" id="cancelEdit" type="button">取消</button><button class="primary" id="saveTags" type="button">保存更改</button></div></footer>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script>
    (() => {
      const state = { page: 1, pages: 1, items: [], days: [], selected: null, selectedImages: new Set(), selectedBound: new Set(), trash: null, tags: [], timer: null, controller: null, autoSticker: null };
      const $ = (id) => document.getElementById(id);
      const gallery = $('gallery');
      const dialog = $('editor');

      function bytes(value) {
        if (value < 1024) return `${value} B`;
        if (value < 1024 * 1024) return `${(value / 1024).toFixed(1)} KB`;
        return `${(value / 1024 / 1024).toFixed(1)} MB`;
      }
      function mediaUrl(item) { return `/media/${encodeURIComponent(item.day)}/${encodeURIComponent(item.file)}`; }
      function toast(message, error = false) {
        const el = $('toast'); el.textContent = message; el.classList.toggle('error', error); el.classList.add('show');
        clearTimeout(toast.timer); toast.timer = setTimeout(() => el.classList.remove('show'), 3000);
      }
      async function api(url, options) {
        const response = await fetch(url, { cache: 'no-store', ...options });
        let data = {};
        try { data = await response.json(); } catch { /* server may send an empty response */ }
        if (!response.ok) { const error = new Error(data.error || `请求失败 (${response.status})`); error.status = response.status; throw error; }
        return data;
      }
      async function saveAutoSticker(enabled) {
        let document = await api('/api/settings');
        for (let attempt = 0; attempt < 2; attempt++) {
          document.settings.autoSticker = enabled;
          try {
            return await api('/api/settings', { method: 'PUT', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ version: document.version, settings: document.settings }) });
          } catch (error) {
            if (error.status !== 409 || attempt > 0) throw error;
            document = await api('/api/settings');
          }
        }
      }
      async function loadAutoSticker() {
        const toggle = $('autoStickerToggle');
        try {
          const document = await api('/api/settings');
          state.autoSticker = document.settings.autoSticker !== false;
          toggle.checked = state.autoSticker; toggle.disabled = false;
          $('autoStickerState').textContent = state.autoSticker ? '新识别的表情会进入待审核' : '已暂停自动收录';
        } catch (error) { $('autoStickerState').textContent = `开关读取失败：${error.message}`; }
      }
      function buildDays(days) {
        const select = $('dayFilter'), current = select.value;
        select.replaceChildren(new Option('全部日期', ''));
        for (const day of days) select.add(new Option(day, day));
        if (days.includes(current)) select.value = current;
      }
      function renderStats(stats) {
        $('statImages').textContent = stats.total.toLocaleString('zh-CN');
        $('statTags').textContent = stats.aliases.toLocaleString('zh-CN');
        $('statSize').textContent = bytes(stats.bytes);
      }
      function makeCard(item) {
        const card = document.createElement('article'); card.className = 'card';
        const thumb = document.createElement('button'); thumb.type = 'button'; thumb.className = 'thumb'; thumb.setAttribute('aria-label', `查看图片 ${item.day} ${item.file}`);
        const img = document.createElement('img'); img.src = mediaUrl(item); img.alt = `${item.day} 保存的图片`; img.loading = 'lazy'; img.decoding = 'async';
        img.addEventListener('error', () => { img.style.visibility = 'hidden'; thumb.dataset.broken = 'true'; }, { once: true });
        thumb.append(img); thumb.addEventListener('click', () => openEditor(item));
        const body = document.createElement('div'); body.className = 'card-body';
        const line = document.createElement('div'); line.className = 'card-line';
        const date = document.createElement('span'); date.className = 'card-date'; date.textContent = item.day;
        const select = document.createElement('input'); select.type = 'checkbox'; select.className = 'card-select';
        select.checked = state.selectedImages.has(imageKey(item));
        select.setAttribute('aria-label', item.tags.length ? `选择表情图片 ${item.file}` : `选择图片 ${item.file}（未绑定关键词，只能批量删除）`);
        select.title = item.tags.length ? '加入批量操作（可审核 / 可删除）' : '加入批量删除（未绑定关键词，不能审核）';
        select.addEventListener('change', () => {
          const key = imageKey(item);
          if (select.checked && state.selectedImages.size >= 200) { select.checked = false; toast('一次最多选择 200 张，请分批操作', true); return; }
          if (select.checked) { state.selectedImages.add(key); if (item.tags.length) state.selectedBound.add(key); }
          else { state.selectedImages.delete(key); state.selectedBound.delete(key); }
          updateBulkControls();
        });
        const order = document.createElement('span'); order.textContent = item.modified.slice(11, 16);
        line.append(date, select, order);
        const id = document.createElement('div'); id.className = 'file-id'; id.textContent = item.file;
        const tags = document.createElement('div'); tags.className = 'tag-row';
        const status = document.createElement('span'); status.className = 'tag';
        status.textContent = ({ pending: '待审核', approved: '已启用', rejected: '已停用', archive: '仅归档' })[item.status] || '仅归档';
        tags.append(status);
        const analysis = item.analysis;
        if (analysis) {
          const badge = (text, className = 'tag tag-ai') => { const el = document.createElement('span'); el.className = className; el.textContent = text; tags.append(el); };
          badge(analysis.kind || '已识别');
          if (analysis.isPhoto !== null) badge(analysis.isPhoto ? '照片' : '非照片');
          if (analysis.valuable !== null) badge(analysis.valuable ? '值得收藏' : '价值较低', analysis.valuable ? 'tag tag-value' : 'tag');
          if (analysis.duplicate === true) badge(analysis.exactDuplicate ? '完全重复' : '疑似重复', 'tag tag-warn');
          else if (analysis.duplicate === false) badge('未发现重复');
          else badge('重复待比对', 'tag');
        }
        if (item.tags.length) for (const text of item.tags.slice(0, 4)) { const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = text; tags.append(tag); }
        else { const empty = document.createElement('span'); empty.className = 'no-tags'; empty.textContent = '尚未绑定表情关键词（不能批量审核）'; tags.append(empty); }
        if (analysis?.tags?.length) for (const text of analysis.tags.filter((value) => !['照片', '非照片', '有收藏价值', '收藏价值低', '重复'].includes(value)).slice(0, 5)) { const tag = document.createElement('span'); tag.className = 'tag tag-ai'; tag.textContent = text; tags.append(tag); }
        if (item.semantics?.deepseek && item.semantics.confidence >= .65) { const theme = document.createElement('span'); theme.className = 'tag theme-tag'; theme.textContent = 'DeepSeek'; tags.prepend(theme); }
        if (item.semantics?.action) { const action = document.createElement('span'); action.className = 'tag'; action.textContent = `动作：${item.semantics.action}`; tags.append(action); }
        if (item.tags.length > 4) { const extra = document.createElement('span'); extra.className = 'no-tags'; extra.textContent = `+${item.tags.length - 4}`; tags.append(extra); }
        const caption = document.createElement('p'); caption.className = 'analysis-caption'; caption.textContent = analysis?.caption || analysis?.valueReason || '';
        const actions = document.createElement('div'); actions.className = 'card-actions';
        const size = document.createElement('span'); size.className = 'size'; size.textContent = bytes(item.bytes);
        const edit = document.createElement('button'); edit.type = 'button'; edit.className = 'edit-button'; edit.textContent = '整理关键词 ↗'; edit.addEventListener('click', () => openEditor(item));
        actions.append(size, edit); body.append(line, id, tags); if (caption.textContent) body.append(caption); body.append(actions); card.append(thumb, body); return card;
      }
      function render(data) {
        state.items = data.items; state.pages = data.pages; state.days = data.days;
        renderStats(data.stats); buildDays(data.days);
        const reviewableOnPage = data.items.filter((item) => item.tags.length).length;
        $('resultCount').textContent = `${data.total.toLocaleString('zh-CN')} 张匹配图片 · 待审核 ${data.moderation?.pending || 0} · 本页 ${data.items.length} 张可删除（其中 ${reviewableOnPage} 张可审核）`;
        $('pageCount').textContent = `${data.page} / ${data.pages}`;
        $('prevPage').disabled = data.page <= 1; $('nextPage').disabled = data.page >= data.pages;
        gallery.replaceChildren();
        if (!data.items.length) {
          const empty = document.createElement('div'); empty.className = 'empty';
          const mark = document.createElement('div'); mark.className = 'empty-mark'; mark.textContent = '∅';
          const text = document.createElement('p'); text.textContent = '这里暂时没有匹配的图片。'; empty.append(mark, text); gallery.append(empty); updateBulkControls(); return;
        }
        for (const item of data.items) gallery.append(makeCard(item));
        updateBulkControls();
      }
      function imageKey(item) { return `${item.day}/${item.file}`; }
      function updateBulkControls() {
        const selectedCount = $('selectedCount');
        const boundSelected = [...state.selectedImages].filter((key) => state.selectedBound.has(key)).length;
        selectedCount.textContent = `已选 ${state.selectedImages.size} 张 · 可审核 ${boundSelected} 张`;
        $('bulkBar').hidden = state.selectedImages.size === 0;
        $('bulkApprove').disabled = boundSelected === 0;
        $('bulkReject').disabled = boundSelected === 0;
        const selectable = state.items;
        const selectedOnPage = selectable.filter((item) => state.selectedImages.has(imageKey(item))).length;
        const selectPage = $('selectPage');
        selectPage.checked = selectable.length > 0 && selectedOnPage === selectable.length;
        selectPage.indeterminate = selectedOnPage > 0 && selectedOnPage < selectable.length;
        selectPage.disabled = selectable.length === 0;
        selectPage.parentElement.classList.toggle('is-disabled', selectable.length === 0);
        selectPage.parentElement.title = selectable.length ? '选择本页全部图片（可批量删除）' : '本页没有图片';
      }
      async function bulkReview(status) {
        const selected = [...state.selectedImages].filter((key) => state.selectedBound.has(key)).map((key) => {
          const [day, file] = key.split('/'); return { day, file };
        });
        if (!selected.length) { toast('所选图片都没有绑定表情关键词，不能审核；可以改用「移入回收（删除）」', true); return; }
        const buttons = [$('bulkApprove'), $('bulkReject'), $('clearSelection')];
        buttons.forEach((button) => { button.disabled = true; });
        try {
          const result = await api('/api/images/bulk-review', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ items: selected, status })
          });
          state.selectedImages.clear();
          state.selectedBound.clear();
          toast(status === 'approved' ? `已通过 ${result.updated} 张图片` : `已拉黑 ${result.updated} 张图片`);
          await load();
        } catch (error) { toast(error.message, true); }
        finally { buttons.forEach((button) => { button.disabled = false; }); updateBulkControls(); }
      }
      async function trashSelected() {
        const selected = [...state.selectedImages].map((key) => {
          const [day, file] = key.split('/'); return { day, file };
        });
        if (!selected.length) return;
        if (selected.length > 200) { toast('一次最多删除 200 张，请分批操作', true); return; }
        if (!confirm(`确定把选中的 ${selected.length} 张图片移入回收目录吗？\n会同时解除这些图片与表情关键词的关联；磁盘空间要等「清空回收」后才真正释放。`)) return;
        const button = $('bulkTrash'); button.disabled = true;
        try {
          const result = await api('/api/images/trash', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ items: selected, confirm: true })
          });
          state.selectedImages.clear();
          state.selectedBound.clear();
          toast(`已移入回收目录 ${result.trashed} 张（${bytes(result.bytes)}），清空回收后才释放磁盘空间`);
          await load(); await loadTrash();
        } catch (error) { toast(error.message, true); }
        finally { button.disabled = false; updateBulkControls(); }
      }
      async function loadTrash() {
        try {
          const data = await api('/api/images/trash');
          state.trash = data;
          $('trashInfo').textContent = data.files
            ? `回收目录：${data.files} 个文件 · 可释放约 ${bytes(data.bytes)}（清空后才释放磁盘；每批 manifest.json 记录了原路径，可手工恢复）`
            : '回收目录为空';
          $('trashInfo').title = data.files ? `回收目录：${data.dir}` : '';
          $('emptyTrash').disabled = data.files === 0;
        } catch (error) {
          state.trash = null;
          $('trashInfo').textContent = `回收目录读取失败：${error.message}`;
          $('emptyTrash').disabled = true;
        }
      }
      async function emptyTrashNow() {
        const info = state.trash;
        if (!info?.files) { toast('回收目录已经是空的'); return; }
        if (!confirm(`将永久删除回收目录中的 ${info.files} 个文件，释放约 ${bytes(info.bytes)}。此操作不可恢复。`)) return;
        if (!confirm('再次确认：永久删除后无法恢复，真的继续吗？')) return;
        const button = $('emptyTrash'); button.disabled = true;
        try {
          const result = await api('/api/images/trash/empty', {
            method: 'POST', headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ confirm: true, confirmEmpty: true })
          });
          toast(`已永久删除 ${result.files} 个文件，释放 ${bytes(result.freedBytes)}`);
        } catch (error) { toast(error.message, true); }
        finally { await loadTrash(); }
      }
      async function load() {
        state.controller?.abort(); state.controller = new AbortController();
        gallery.replaceChildren(Object.assign(document.createElement('div'), { className: 'loading', textContent: '正在整理图片索引…' }));
        const params = new URLSearchParams({ page: String(state.page), limit: '48', sort: $('sortFilter').value });
        if ($('search').value.trim()) params.set('q', $('search').value.trim());
        if ($('dayFilter').value) params.set('day', $('dayFilter').value);
        if ($('statusFilter').value) params.set('status', $('statusFilter').value);
        if ($('analysisFilter').value) params.set('analysis', $('analysisFilter').value);
        try {
          const response = await fetch(`/api/images?${params}`, { signal: state.controller.signal, cache: 'no-store' });
          const data = await response.json(); if (!response.ok) throw new Error(data.error || '读取失败'); render(data);
        } catch (error) {
          if (error.name === 'AbortError') return;
          gallery.replaceChildren(Object.assign(document.createElement('div'), { className: 'empty', textContent: `读取图片库失败：${error.message}` }));
          $('resultCount').textContent = '图片库暂不可用';
        }
      }
      function renderTags() {
        const host = $('tagEditor'); host.querySelectorAll('.tag-pill').forEach((el) => el.remove());
        const input = $('tagInput');
        for (const [index, text] of state.tags.entries()) {
          const pill = document.createElement('span'); pill.className = 'tag-pill';
          const label = document.createElement('span'); label.textContent = text;
          const remove = document.createElement('button'); remove.type = 'button'; remove.textContent = '×'; remove.setAttribute('aria-label', `移除关键词 ${text}`);
          remove.addEventListener('click', () => { state.tags.splice(index, 1); renderTags(); });
          pill.append(label, remove); host.insertBefore(pill, input);
        }
      }
      function openEditor(item) {
        state.selected = item; state.tags = [...item.tags];
        $('editorId').textContent = `${item.day} / ${item.file}`;
        $('previewImage').src = mediaUrl(item); $('metaDay').textContent = item.day; $('metaSize').textContent = bytes(item.bytes);
        const analysis = item.analysis;
        $('analysisNote').textContent = analysis
          ? `AI识别：${analysis.kind || '类别未知'} · ${analysis.isPhoto === null ? '照片类型未知' : analysis.isPhoto ? '照片' : '非照片'} · ${analysis.valuable === null ? '价值待判断' : analysis.valuable ? '有收藏价值' : '收藏价值低'} · ${analysis.duplicate === null ? '重复待比对' : analysis.duplicate ? `${analysis.exactDuplicate ? '完全重复' : '疑似重复'}${analysis.duplicateOf && analysis.duplicateOf !== item.file ? `（对比 ${analysis.duplicateOf}）` : ''}` : '未发现重复'}${analysis.valueReason ? `。${analysis.valueReason}` : ''}${analysis.duplicateReason ? ` 重复判断：${analysis.duplicateReason}` : ''}${analysis.caption ? ` 画面：${analysis.caption}` : ''}`
          : '这张图片还没有 AI 分类记录。新收到的图片会自动识别照片类型、收藏价值、重复情况和内容标签。';
        $('moderationStatus').value = ['pending', 'approved', 'rejected'].includes(item.status) ? item.status : 'approved';
        $('tagInput').value = '';
        $('deepseekTheme').value = item.semantics ? (item.semantics.deepseek ? 'yes' : 'no') : '';
        $('semanticAction').value = item.semantics?.action || '';
        $('semanticEmotion').value = item.semantics?.emotion || '';
        renderTags(); dialog.showModal();
      }
      function addTag() {
        const input = $('tagInput'); const tag = input.value.trim(); if (!tag) return;
        if ([...tag].length > 40) { toast('关键词最多 40 个字符', true); return; }
        if (!state.tags.some((item) => item.toLocaleLowerCase('zh-CN') === tag.toLocaleLowerCase('zh-CN'))) state.tags.push(tag);
        input.value = ''; renderTags(); input.focus();
      }
      $('tagInput').addEventListener('keydown', (event) => {
        if (event.key === 'Enter' || event.key === ',') { event.preventDefault(); addTag(); }
      });
      $('selectPage').addEventListener('change', () => {
        const items = state.items;
        const nextSize = items.filter((item) => !state.selectedImages.has(imageKey(item))).length + state.selectedImages.size;
        if ($('selectPage').checked && nextSize > 200) { $('selectPage').checked = false; toast('一次最多选择 200 张，请分批操作', true); return; }
        for (const item of items) {
          const key = imageKey(item);
          if ($('selectPage').checked) { state.selectedImages.add(key); if (item.tags.length) state.selectedBound.add(key); }
          else { state.selectedImages.delete(key); state.selectedBound.delete(key); }
        }
        updateBulkControls();
      });
      $('bulkApprove').addEventListener('click', () => bulkReview('approved'));
      $('bulkReject').addEventListener('click', () => bulkReview('rejected'));
      $('bulkTrash').addEventListener('click', trashSelected);
      $('emptyTrash').addEventListener('click', emptyTrashNow);
      $('clearSelection').addEventListener('click', () => { state.selectedImages.clear(); state.selectedBound.clear(); updateBulkControls(); load(); });
      $('autoStickerToggle').addEventListener('change', async () => {
        const toggle = $('autoStickerToggle'), requested = toggle.checked, previous = state.autoSticker;
        toggle.disabled = true; $('autoStickerState').textContent = '正在保存…';
        try {
          const saved = await saveAutoSticker(requested);
          state.autoSticker = saved.settings.autoSticker;
          toggle.checked = state.autoSticker;
          $('autoStickerState').textContent = state.autoSticker ? '新识别的表情会进入待审核' : '已暂停自动收录';
          toast(state.autoSticker ? '自动收录已开启' : '自动收录已暂停');
        } catch (error) {
          state.autoSticker = previous; toggle.checked = previous;
          $('autoStickerState').textContent = previous ? '新识别的表情会进入待审核' : '已暂停自动收录';
          toast(`开关保存失败：${error.message}`, true);
        } finally { toggle.disabled = false; }
      });
      $('saveTags').addEventListener('click', async () => {
        if (!state.selected) return; const button = $('saveTags'); button.disabled = true;
        try {
          const theme = $('deepseekTheme').value;
          const action = $('semanticAction').value.trim(), emotion = $('semanticEmotion').value.trim();
          const original = state.selected.semantics;
          const oldTheme = original ? (original.deepseek ? 'yes' : 'no') : '';
          const changed = theme !== oldTheme || action !== (original?.action || '') || emotion !== (original?.emotion || '');
          if (changed && !theme) throw new Error('请先选择是否属于 DeepSeek 主题');
          const semantics = changed ? { deepseek: theme === 'yes', action, emotion } : null;
          await api(`/api/images/${encodeURIComponent(state.selected.day)}/${encodeURIComponent(state.selected.file)}`, { method: 'PATCH', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ tags: state.tags, semantics, status: $('moderationStatus').value }) });
          dialog.close(); toast('图片关键词和审核状态已保存'); await load();
        } catch (error) { toast(error.message, true); }
        finally { button.disabled = false; }
      });
      $('deleteImage').addEventListener('click', async () => {
        if (!state.selected) return;
        const count = state.tags.length;
        const detail = count ? `\n同时移除这张图关联的 ${count} 个表情关键词。` : '';
        if (!confirm(`确定删除这张图片吗？\n${state.selected.file}${detail}\n此操作会删除本地原图。`)) return;
        const button = $('deleteImage'); button.disabled = true;
        try {
          const result = await api(`/api/images/${encodeURIComponent(state.selected.day)}/${encodeURIComponent(state.selected.file)}`, { method: 'DELETE' });
          dialog.close(); toast(result.reassignedAliases ? `图片已删除，${result.reassignedAliases} 个关键词已指向相同图片的存档副本` : '图片和关联关键词已删除'); await load();
        } catch (error) { toast(error.message, true); }
        finally { button.disabled = false; }
      });
      $('closeEditor').addEventListener('click', () => dialog.close());
      $('cancelEdit').addEventListener('click', () => dialog.close());
      $('prevPage').addEventListener('click', () => { state.page = Math.max(1, state.page - 1); load(); });
      $('nextPage').addEventListener('click', () => { state.page = Math.min(state.pages, state.page + 1); load(); });
      $('dayFilter').addEventListener('change', () => { state.page = 1; load(); });
      $('statusFilter').addEventListener('change', () => { state.page = 1; load(); });
      $('analysisFilter').addEventListener('change', () => { state.page = 1; load(); });
      $('sortFilter').addEventListener('change', () => { state.page = 1; load(); });
      $('search').addEventListener('input', () => { clearTimeout(state.timer); state.timer = setTimeout(() => { state.page = 1; load(); }, 220); });
      loadAutoSticker();
      load();
      loadTrash();
    })();
  </script>
</body>
